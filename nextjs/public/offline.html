<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Mrs Sarah Early Years Tutoring</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #14263F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      padding: 40px 24px;
      border-radius: 16px;
      background: #E8F0FA;
      border: 1px solid #C7DAF3;
    }
    .badge {
      display: inline-block;
      background-color: #D4A017;
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      color: #1E4E8C;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 12px;
    }
    p {
      color: #6B7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #1E4E8C;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background-color: #153763;
    }
    .contact-info {
      margin-top: 24px;
      font-size: 14px;
      color: #14263F;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Mode</div>
    <h1>You are currently offline</h1>
    <p>Mrs Sarah Early Years Tutoring cached pages are available, but you need an internet connection to book sessions or access live updates.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="contact-info">
      Direct tutor contact: <strong>09133651659</strong><br>
      Email: <strong>sarahoakhena@gmail.com</strong>
    </div>
  </div>
</body>
</html>
